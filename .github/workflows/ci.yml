# 2.5.0: her push ve PR'da plugin'in deterministik denetimleri (ağ, Claude ya da Meta hesabı gerekmez).
# Model değerlendirme seti (evals/vakalar) burada çalışmaz: Claude kimlik bilgisi ister; yayın öncesi elle çalıştırılır (evals/README.md).
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 2.10.6: yavaş apt aynasında ffmpeg kurulumu tek başına 25+ dakika sürebildi
    defaults:
      run:
        working-directory: reklam-atolyesi/servers/ad_memory
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 2.10.0: ezber denetimi önceki sürümle farkı okur
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg  # 2.10.5: önerilen paketler (ses tanıma, sürücüler) indirme süresini 30 dakikayı aşırıyordu
      - name: Bağımlılıklar
        run: uv sync --frozen
      - name: Testler (senaryo matrisi dahil)
        run: uv run --with pytest python -m pytest -q ../../tests
      - name: Sürüm, manifest ve nötrlük tutarlılığı
        run: uv run python ../../scripts/setup/ci_check.py
      - name: Ezber denetimi (vakadan plugin metnine kopya yok)
        run: uv run python ../../evals/ezber_denetimi.py

  # 2.10.7: müşterilerin kurduğu platform Windows. 2.10.6'da saat dilimi verisi (tzdata) kilitten düştüğünde Linux işi bunu göremedi;
  # Windows'ta işletim sistemi IANA verisi vermediği için aynı hata burada ilk marka kaydında çıkar. Müşteri paketi testleri de burada
  # gerçek PowerShell 5.1 ile çalışır (Linux'ta atlanır). ffmpeg choco ile kurulur (müşteri platformu; ffmpeg isteyen testler burada da çalışır).
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: reklam-atolyesi/servers/ad_memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Bağımlılıklar
        run: uv sync --frozen
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Saat dilimi verisi (sistem verisi olmadan)
        run: uv run python -c "import zoneinfo; zoneinfo.ZoneInfo('Europe/Istanbul'); zoneinfo.ZoneInfo('America/New_York'); print('ok')"
      - name: Testler
        env:
          PYTHONUTF8: "1"
        run: uv run --with pytest python -m pytest -q ../../tests
